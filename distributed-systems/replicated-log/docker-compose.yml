# 1 master + 2 secondaries. All nodes listen on 8080 inside the Docker network.
#
# Host ports:
#   master      -> localhost:28080
#   secondary-1 -> localhost:28081
#   secondary-2 -> localhost:28082
#
# To see blocking replication, pause a secondary: `docker compose pause secondary-2`.
# Appends then wait until `docker compose unpause secondary-2`.
#
# `init: true` runs a small init as PID 1, so `docker compose stop` ends a node at once.

services:
  master:
    build: .
    image: replicated-log:latest
    init: true
    command: ["master"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORT: "8080"
      SECONDARIES: http://secondary-1:8080,http://secondary-2:8080
      # How long to wait for a secondary's ACK before sending again.
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
      # Pause before sending a failed message again.
      RETRY_DELAY_MS: ${RETRY_DELAY_MS:-1000}
      # Upper limit for the pause, which grows with each attempt.
      MAX_RETRY_DELAY_MS: ${MAX_RETRY_DELAY_MS:-30000}
      # How often the master sends a heartbeat to each secondary.
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-1000}
      # No successful heartbeat for this long -> Suspected, then Unhealthy.
      SUSPECTED_AFTER_MS: ${SUSPECTED_AFTER_MS:-3000}
      UNHEALTHY_AFTER_MS: ${UNHEALTHY_AFTER_MS:-10000}
    ports: ["28080:8080"]
    depends_on: [secondary-1, secondary-2]

  secondary-1:
    build: .
    image: replicated-log:latest
    init: true
    command: ["secondary"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORT: "8080"
    ports: ["28081:8080"]

  secondary-2:
    build: .
    image: replicated-log:latest
    init: true
    command: ["secondary"]
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      PORT: "8080"
    ports: ["28082:8080"]
